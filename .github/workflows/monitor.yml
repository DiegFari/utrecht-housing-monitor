name: Housing monitor

on:
  schedule:
    # Every five minutes, offset from the busiest minute of the hour.
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Choose a check or an email test'
        required: true
        default: status-email
        type: choice
        options:
          - status-email
          - test-email
          - simulate-alert
          - dry-run
          - check

# The state branch stores public listing data, never credentials.
permissions:
  contents: read

concurrency:
  group: housing-monitor
  cancel-in-progress: false

jobs:
  monitor:
    # Scheduling starts only after the owner has configured secrets and opted in.
    # Manual runs are restricted to the default branch; forks do not run this job.
    if: >-
      github.event.repository.fork == false &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' || vars.MONITOR_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      MODE: ${{ inputs.mode || 'check' }}
      BROWSER_CHANNEL: chromium
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Check out trusted default-branch code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore browser binaries
        if: env.MODE == 'check' || env.MODE == 'status-email' || env.MODE == 'dry-run'
        id: browser-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          # Never cache .env, data/, diagnostics, or the whole workspace.
          path: ~/.cache/ms-playwright
          key: browser-ubuntu24-x64-${{ hashFiles('requirements.txt') }}

      - name: Install browser system dependencies
        if: env.MODE == 'check' || env.MODE == 'status-email' || env.MODE == 'dry-run'
        run: python -m playwright install-deps chromium

      - name: Install Chromium
        if: >-
          (env.MODE == 'check' || env.MODE == 'status-email' || env.MODE == 'dry-run') &&
          steps.browser-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --no-shell chromium

      - name: Restore alert history
        if: env.MODE == 'check'
        id: restore
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python github_state.py restore

      - name: Run selected check
        id: check
        continue-on-error: true
        env:
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: '587'
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          case "$MODE" in
            check)          xvfb-run -a python housing.py --once --headed ;;
            dry-run)        xvfb-run -a python housing.py --once --dry-run --headed ;;
            status-email)   xvfb-run -a python housing.py --status-email --headed ;;
            test-email)     python housing.py --test-email ;;
            simulate-alert) python housing.py --simulate-alert ;;
            *) exit 2 ;;
          esac

      - name: Save alert history even when one site failed
        if: ${{ always() && steps.restore.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python github_state.py save

      - name: Report failed checks
        if: ${{ always() && steps.check.outcome == 'failure' }}
        run: |
          echo 'At least one check or email delivery failed; review the earlier steps.'
          echo 'Availability is unknown for failed sites. Other sites were still checked.'
          exit 1
